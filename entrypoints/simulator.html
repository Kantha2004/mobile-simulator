<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phone Simulator</title>
  <link rel="stylesheet" href="./simulator/style.css" />
</head>
<body>
  <!-- Single Unified Sleek Navigation Bar -->
  <header class="topbar">
    <!-- Left: Brand & Device Selector -->
    <div class="topbar-section topbar-left">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="14" height="20" x="5" y="2" rx="2" ry="2"/>
          <path d="M12 18h.01"/>
        </svg>
        <span class="brand-name">Simulator</span>
      </div>

      <div class="device-pill">
        <select id="device-select" title="Select Device Model">
          <!-- Populated from devices.js -->
        </select>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m6 9 6 6 6-6"/>
        </svg>
      </div>

      <!-- Add Device Side-by-Side Button -->
      <button id="btn-add-device" class="icon-btn" title="Add Device Side-by-Side (+)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14"/>
          <path d="M12 5v14"/>
        </svg>
      </button>

      <button id="btn-orientation" class="icon-btn" title="Rotate Device Orientation (Alt+O)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
          <path d="M21 3v5h-5"/>
          <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
          <path d="M3 21v-5h5"/>
          <rect x="8.5" y="6.5" width="7" height="11" rx="1.5"/>
        </svg>
        <span id="orientation-label" class="sr-only">Portrait</span>
      </button>

      <div class="scale-pill">
        <select id="scale-select" title="Zoom Scale">
          <option value="fit" selected>Fit</option>
          <option value="0.25">25%</option>
          <option value="0.33">33%</option>
          <option value="0.5">50%</option>
          <option value="0.75">75%</option>
          <option value="1.0">100%</option>
          <option value="1.25">125%</option>
        </select>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m6 9 6 6 6-6"/>
        </svg>
      </div>

      <div class="viewmode-pill" title="Display View Mode">
        <select id="viewmode-select">
          <option value="browser" selected>Browser (Header/Footer)</option>
          <option value="pwa">PWA (Standalone)</option>
          <option value="fullscreen">Fullscreen</option>
        </select>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m6 9 6 6 6-6"/>
        </svg>
      </div>
    </div>

    <!-- Center: Minimal Omnibox Browser Bar -->
    <div class="topbar-section topbar-center">
      <div class="omnibox-container">
        <button id="btn-reload" class="omnibox-btn" title="Reload (Alt+R)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
            <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
            <path d="M16 16h5v5"/>
          </svg>
        </button>

        <form id="url-form" class="url-form">
          <svg class="url-lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="text" id="url-input" placeholder="Search or enter URL (e.g. localhost:3000)" spellcheck="false" autocomplete="off" />
          <button type="button" id="btn-clear-url" class="omnibox-btn btn-clear-icon" title="Clear">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 6 6 18"/>
              <path d="m6 6 12 12"/>
            </svg>
          </button>
          <span id="protocol-text" class="sr-only">HTTPS</span>
        </form>

        <button id="btn-back" class="omnibox-btn" title="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6"/>
          </svg>
        </button>
        <button id="btn-forward" class="omnibox-btn" title="Forward">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 18 6-6-6-6"/>
          </svg>
        </button>
        <button id="btn-home" class="omnibox-btn" title="Default Home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Right: Clean Minimal Controls -->
    <div class="topbar-section topbar-right">
      <!-- Dimensions HUD Tag -->
      <div class="hud-badge">
        <span id="hud-dimensions">393 Ã— 852</span>
        <span id="hud-dpr" class="hud-dpr-text">3x</span>
        <span id="hud-zoom" class="sr-only">100%</span>
      </div>

      <div class="action-divider"></div>

      <!-- Toggle Bezel Mockup -->
      <button id="btn-toggle-frame" class="icon-btn is-active" title="Toggle Device Frame (Alt+F)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="16" height="20" x="4" y="2" rx="3"/>
          <rect width="10" height="14" x="7" y="5" rx="1.5"/>
        </svg>
      </button>

      <!-- Toggle Mobile Touch Simulation -->
      <button id="btn-touch-mode" class="icon-btn is-active" title="Touch Simulation (Drag-to-scroll)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v0"/>
          <path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2"/>
          <path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8"/>
          <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/>
        </svg>
      </button>

      <!-- Toggle Mouse Arrow Cursor on Top of Touch Ball -->
      <button id="btn-mouse-arrow" class="icon-btn is-active" title="Toggle Mouse Arrow Cursor on Touch Ball">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 3 7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/>
          <path d="m13 13 6 6"/>
        </svg>
      </button>

      <!-- QR Code for Physical Phone -->
      <button id="btn-qr" class="icon-btn" title="Scan with Phone (QR Code)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="5" height="5" x="3" y="3" rx="1"/>
          <rect width="5" height="5" x="16" y="3" rx="1"/>
          <rect width="5" height="5" x="3" y="16" rx="1"/>
          <path d="M21 16h-3a2 2 0 0 0-2 2v3"/>
          <path d="M21 21v.01"/>
          <path d="M12 7v3a2 2 0 0 1-2 2H7"/>
          <path d="M3 12h.01"/>
          <path d="M12 3h.01"/>
          <path d="M12 16v.01"/>
          <path d="M16 12h1"/>
          <path d="M21 12v.01"/>
          <path d="M12 21v-1"/>
        </svg>
      </button>

      <!-- Screenshot Capture -->
      <button id="btn-screenshot" class="icon-btn" title="Capture Screenshot">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/>
          <circle cx="12" cy="13" r="3"/>
        </svg>
      </button>

      <!-- Bezel Finish Switcher -->
      <button id="btn-theme" class="icon-btn" title="Chassis Finish (Titanium Dark, Silver, Natural)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>
        </svg>
      </button>

      <!-- Custom Dimensions -->
      <button id="btn-custom-device" class="icon-btn" title="Custom Dimensions">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="21" x2="14" y1="4" y2="4"/>
          <line x1="10" x2="3" y1="4" y2="4"/>
          <line x1="21" x2="12" y1="12" y2="12"/>
          <line x1="8" x2="3" y1="12" y2="12"/>
          <line x1="21" x2="16" y1="20" y2="20"/>
          <line x1="12" x2="3" y1="20" y2="20"/>
          <line x1="14" x2="14" y1="2" y2="6"/>
          <line x1="8" x2="8" y1="10" y2="14"/>
          <line x1="16" x2="16" y1="18" y2="22"/>
        </svg>
      </button>

      <!-- Toggle Chrome DevTools Container -->
      <button id="btn-toggle-devtools" class="icon-btn" title="Toggle Chrome DevTools (Alt+D)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 18 22 12 16 6"/>
          <polyline points="8 6 2 12 8 18"/>
        </svg>
      </button>

      <!-- Settings Page -->
      <button id="btn-settings" class="icon-btn" title="Open Settings (Options)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Simulator Main Stage Canvas -->
  <main class="stage-container" id="stage-container">
    <!-- Populated dynamically by simulator.js for single or multi-device side-by-side view -->
  </main>

  <!-- Docked Chrome DevTools Container -->
  <div id="devtools-dock-container" class="devtools-dock-container" style="display: none;">
    <div class="devtools-resizer" id="devtools-resizer"></div>
    <div class="devtools-dock-body" id="devtools-dock-body"></div>
  </div>

  <!-- Modal: QR Code for Real Phone -->
  <div id="modal-qr" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-top">
        <h3>Open on Real Phone</h3>
        <button class="modal-close" data-close="modal-qr">&times;</button>
      </div>
      <p class="modal-subtitle">Scan this QR code with your phone camera to test live on hardware:</p>
      <div id="qr-target" class="qr-box"></div>
      <div class="qr-copy-row">
        <input type="text" id="qr-url-text" readonly />
        <button id="btn-copy-url" class="btn-compact">Copy</button>
      </div>
    </div>
  </div>

  <!-- Modal: Custom Dimensions -->
  <div id="modal-custom" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-top">
        <h3>Custom Viewport</h3>
        <button class="modal-close" data-close="modal-custom">&times;</button>
      </div>
      <form id="custom-device-form">
        <div class="field-group">
          <label for="custom-name">Device Name</label>
          <input type="text" id="custom-name" value="Custom Phone" required />
        </div>
        <div class="field-grid">
          <div class="field-group">
            <label for="custom-width">Width (px)</label>
            <input type="number" id="custom-width" min="200" max="3840" value="390" required />
          </div>
          <div class="field-group">
            <label for="custom-height">Height (px)</label>
            <input type="number" id="custom-height" min="200" max="3840" value="844" required />
          </div>
        </div>
        <div class="field-grid">
          <div class="field-group">
            <label for="custom-dpr">Pixel Ratio (DPR)</label>
            <select id="custom-dpr">
              <option value="1.0">1.0x (Standard)</option>
              <option value="1.5">1.5x (Dense)</option>
              <option value="2.0">2.0x (Retina)</option>
              <option value="3.0" selected>3.0x (Super Retina)</option>
              <option value="3.5">3.5x (Ultra)</option>
            </select>
          </div>
          <div class="field-group">
            <label for="custom-type">Chassis Type</label>
            <select id="custom-type">
              <option value="iphone-island">iPhone (Dynamic Island)</option>
              <option value="iphone-notch">iPhone (Notch)</option>
              <option value="android-punch">Android (Punch Hole)</option>
              <option value="tablet">Tablet</option>
              <option value="laptop">Laptop</option>
              <option value="monitor">Monitor / Desktop</option>
            </select>
          </div>
        </div>
        <div class="modal-actions">
          <button type="submit" class="btn-primary-action">Apply Dimensions</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Add Device Side-by-Side -->
  <div id="modal-add-device" class="modal-overlay">
    <div class="modal-card modal-card-wide">
      <div class="modal-top">
        <h3>Add Device Side-by-Side</h3>
        <button class="modal-close" data-close="modal-add-device">&times;</button>
      </div>
      <p class="modal-subtitle">Select a device preset to compare side-by-side:</p>

      <!-- Search & Filter Controls -->
      <div class="picker-filter-container">
        <div class="picker-search-box">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.3-4.3"/>
          </svg>
          <input type="text" id="picker-search-input" placeholder="Search devices (e.g. MacBook, S24, 4K, iPad, 16 Pro)..." autocomplete="off" spellcheck="false" />
          <button type="button" id="btn-clear-picker-search" class="btn-clear-search" style="display:none;" title="Clear search">&times;</button>
        </div>
        <div class="picker-filter-chips" id="picker-filter-chips">
          <button type="button" class="picker-chip is-active" data-cat="all">All</button>
          <button type="button" class="picker-chip" data-cat="Apple iPhone">iPhone</button>
          <button type="button" class="picker-chip" data-cat="Android Phones">Android</button>
          <button type="button" class="picker-chip" data-cat="Tablets">Tablets</button>
          <button type="button" class="picker-chip" data-cat="Laptops">Laptops</button>
          <button type="button" class="picker-chip" data-cat="Monitors & Desktops">Monitors</button>
        </div>
      </div>

      <div class="device-picker-grid" id="device-picker-grid">
        <!-- Rendered dynamically from devices.js -->
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Main Script -->
  <script type="module" src="./simulator/main.ts"></script>
</body>
</html>
